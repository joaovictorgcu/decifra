# DECIFRA com PostgreSQL.  Subir: docker compose up --build   →  http://localhost:3333
# Chaves de IA (opcionais) vêm do seu .env ou do ambiente; sem elas, o motor de regras assume.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: decifra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decifra-local}
      POSTGRES_DB: decifra
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decifra -d decifra"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://decifra:${POSTGRES_PASSWORD:-decifra-local}@db:5432/decifra
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3333}
      # Local sem HTTPS: em produção, deixe o padrão (cookie Secure) e use HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_PLANO: ${GEMINI_PLANO:-gratuito}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Ollama rodando na sua máquina (fora do contêiner):
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_MODEL_SIMPLES: ${OLLAMA_MODEL_SIMPLES:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_AVANCADO: ${AI_AVANCADO:-none}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  dados:
